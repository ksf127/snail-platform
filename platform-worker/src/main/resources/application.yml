server:
  port: 8089

spring:
  application:
    name: platform-worker
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:platform}
    password: ${RABBITMQ_PASSWORD:platform123}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: platform-worker

platform:
  control:
    url: ${CONTROL_URL:http://localhost:8088}
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
  workspace:
    dir: ${WORKSPACE_DIR:./workspace}
  executor:
    default: ${EXECUTOR_DEFAULT:DOCKER}
    timeout-seconds: ${EXECUTOR_TIMEOUT_SECONDS:1800}
    poll-interval-seconds: ${EXECUTOR_POLL_INTERVAL_SECONDS:3}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:platform}
    secret-key: ${MINIO_SECRET_KEY:platform123}
    bucket: ${MINIO_BUCKET:platform-artifacts}
  k8s:
    kubeconfig: ${K8S_KUBECONFIG:}
    namespace: ${K8S_NAMESPACE:platform}
    git-image: ${K8S_GIT_IMAGE:alpine/git:latest}
    tool-image: ${K8S_TOOL_IMAGE:alpine:3.20}
    workspace-size: ${K8S_WORKSPACE_SIZE:1Gi}
    poll-interval-seconds: ${K8S_POLL_INTERVAL_SECONDS:3}
    timeout-seconds: ${K8S_TIMEOUT_SECONDS:1800}
  jenkins:
    url: ${JENKINS_URL:}
    user: ${JENKINS_USER:}
    token: ${JENKINS_TOKEN:}
    job: ${JENKINS_JOB:}

logging:
  level:
    com.company.platform: INFO
